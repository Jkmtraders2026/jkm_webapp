name: Deploy shared JKM backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jkm-backend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ALLOWED_ORIGINS: ${{ vars.JKM_ALLOWED_ORIGINS }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate deployment configuration
        run: python3 scripts/backend_env.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the selected project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply versioned migrations
        run: supabase db push
      - name: Configure the public intake endpoint
        run: supabase secrets set --env-file "$RUNNER_TEMP/jkm-backend.env" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy request intake
        run: supabase functions deploy submit-request --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Remove temporary configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/jkm-backend.env"
